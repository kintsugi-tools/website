<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Kintsugi approval queue">
  <rect width="960" height="540" fill="#0a0f16"/>
  <rect x="80" y="58" width="800" height="424" rx="14" fill="#131b26" stroke="#26313f"/>
  <rect x="80" y="58" width="800" height="48" rx="14" fill="#101720"/>
  <rect x="80" y="94" width="800" height="12" fill="#101720"/>
  <circle cx="108" cy="82" r="6" fill="#34404f"/><circle cx="130" cy="82" r="6" fill="#34404f"/><circle cx="152" cy="82" r="6" fill="#34404f"/>
  <text x="176" y="89" fill="#93a1b3" font-family="ui-monospace, Menlo, monospace" font-size="14">kintsugi — approval queue</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="17">
    <text x="110" y="150" fill="#71827e">$</text><text x="130" y="150" fill="#e6edf3">kg guard -- claude</text>
    <text x="110" y="190" fill="#e6c458">◆</text><text x="134" y="190" fill="#e6edf3">git push --force origin main</text>
    <text x="134" y="224" fill="#71827e">rule:</text><text x="188" y="224" fill="#ff7b72">history-rewrite</text><text x="322" y="224" fill="#71827e">· certain</text>
    <text x="134" y="258" fill="#71827e">why:</text><text x="186" y="258" fill="#e6edf3">overwrites remote history</text>
    <text x="134" y="292" fill="#71827e">action:</text><text x="200" y="292" fill="#e6c458">held for approval</text>
    <text x="110" y="348" fill="#71827e">[y] allow  [n] deny  [u] allow + undo</text><rect x="452" y="335" width="9" height="17" fill="#e6c458"/>
  </g>
  <rect x="180" y="430" width="600" height="2" fill="#d4af37" opacity="0.8"/>
</svg>

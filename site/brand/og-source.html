<!doctype html><html><head><meta charset="utf-8"><title>og</title>
<style>
html,body{margin:0}
body{width:1200px;height:630px;position:relative;overflow:hidden;background:#0B0E13;color:#F3F1EA;font-family:'Inter Display','Inter',sans-serif}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse 620px 360px at 50% -40px,rgba(212,166,42,.22),transparent 70%),
linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/48px 48px;
-webkit-mask-image:radial-gradient(ellipse 90% 90% at 50% 30%,#000 30%,transparent 100%);mask-image:radial-gradient(ellipse 90% 90% at 50% 30%,#000 30%,transparent 100%)}
.glow{position:absolute;inset:0;background:radial-gradient(ellipse 620px 360px at 50% -40px,rgba(212,166,42,.20),transparent 70%)}
.in{position:absolute;left:80px;right:80px;top:64px;bottom:60px}
.logo{height:100px;display:block;margin-left:-6px}
h1{position:absolute;left:0;top:150px;margin:0;width:900px;font-weight:700;font-size:62px;line-height:1.08;letter-spacing:-.03em}
h1 em{font-style:normal;color:#D4A62A}
.chips{position:absolute;left:0;top:380px;display:flex;gap:14px}
.chip{border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:12px 22px;font:500 21px 'JetBrains Mono',monospace;color:#F3F1EA;background:rgba(255,255,255,.03)}
.chip b{color:#D4A62A;font-weight:600;margin-right:10px}
.url{position:absolute;left:0;bottom:0;font:500 22px 'JetBrains Mono',monospace;color:#8d9bad;letter-spacing:.01em}
</style></head><body><div class="bg"></div><div class="glow"></div>
<div class="in"><img class="logo" src="kintsugi-lockup-on-dark.svg" alt="">
<h1>Local-first tools for building with <em>AI agents.</em></h1>
<div class="chips"><span class="chip"><b>01</b>Kintsugi · safety</span><span class="chip"><b>02</b>Paper · search</span><span class="chip"><b>03</b>Oryn · tests</span></div>
<div class="url">kintsugi.tools</div></div></body></html>
